<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake v2.0</title>
    <style>
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Prevent scrolling on mobile */
        }
        
        h1 {
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            border: 2px solid #333;
        }

        canvas {
            background-color: #000;
            display: block;
        }

        #score-board {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .score-item span {
            color: #00ffcc;
            text-shadow: 0 0 5px #00ffcc;
        }

        /* Mobile Controls hint */
        #mobile-hint {
            margin-top: 10px;
            color: #666;
            font-size: 0.8rem;
            display: none;
        }
        
        @media (max-width: 768px) {
            #mobile-hint { display: block; }
        }
    </style>
</head>
<body>

    <h1>NEON SNAKE</h1>
    
    <div id="score-board">
        <div class="score-item">Score: <span id="score">0</span></div>
        <div class="score-item">High Score: <span id="high-score">0</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <div id="mobile-hint">Swipe to move • Tap to restart</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');

        // Game Settings
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        // Game State
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        highScoreElement.innerText = highScore;

        let velocity = { x: 0, y: 0 };
        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let particles = [];
        let gameSpeed = 100;
        let lastTime = 0;
        let gameLoopId;

        // Mobile Touch Variables
        let touchStartX = 0;
        let touchStartY = 0;

        // --- INPUT HANDLING ---
        window.addEventListener('keydown', e => {
            switch (e.key) {
                case 'ArrowUp': if (velocity.y === 0) velocity = { x: 0, y: -1 }; break;
                case 'ArrowDown': if (velocity.y === 0) velocity = { x: 0, y: 1 }; break;
                case 'ArrowLeft': if (velocity.x === 0) velocity = { x: -1, y: 0 }; break;
                case 'ArrowRight': if (velocity.x === 0) velocity = { x: 1, y: 0 }; break;
            }
        });

        // Touch Controls
        canvas.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
            e.preventDefault(); // Prevent scrolling
        }, { passive: false });

        canvas.addEventListener('touchend', e => {
            if (velocity.x === 0 && velocity.y === 0) {
                 // Start game on tap if idle
                 velocity = { x: 1, y: 0 };
                 return;
            }

            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0 && velocity.x === 0) velocity = { x: 1, y: 0 };
                else if (dx < 0 && velocity.x === 0) velocity = { x: -1, y: 0 };
            } else {
                if (dy > 0 && velocity.y === 0) velocity = { x: 0, y: 1 };
                else if (dy < 0 && velocity.y === 0) velocity = { x: 0, y: -1 };
            }
            e.preventDefault();
        }, { passive: false });

        // --- GAME LOGIC ---
        function update(currentTime) {
            window.requestAnimationFrame(update);
            
            const secondsSinceLastRender = (currentTime - lastTime) / 1000;
            if (secondsSinceLastRender < 1 / (10 + Math.floor(score/5))) return; // Speed increases with score
            
            lastTime = currentTime;
            
            // Move Snake
            const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

            // Wrap around walls (Arcade style)
            if (head.x < 0) head.x = tileCount - 1;
            if (head.x >= tileCount) head.x = 0;
            if (head.y < 0) head.y = tileCount - 1;
            if (head.y >= tileCount) head.y = 0;

            // Check Collision (Self)
            if (velocity.x !== 0 || velocity.y !== 0) {
                for (let i = 0; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        resetGame();
                        return;
                    }
                }
            }

            snake.unshift(head);

            // Check Food
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreElement.innerText = score;
                createParticles(food.x * gridSize, food.y * gridSize, '#ff0055'); // Explosion
                placeFood();
                
                // Update High Score
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snakeHighScore', highScore);
                    highScoreElement.innerText = highScore;
                }
            } else {
                snake.pop(); // Remove tail
            }

            draw();
        }

        function draw() {
            // Clear Screen
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Particles
            updateParticles();

            // Draw Food (Glowing Orb)
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff0055";
            ctx.fillStyle = '#ff0055';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0; // Reset shadow for next draws

            // Draw Snake
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#00ffcc' : '#00997a'; // Head is brighter
                ctx.shadowBlur = index === 0 ? 15 : 0; // Head glows
                ctx.shadowColor = '#00ffcc';
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
                ctx.shadowBlur = 0;
            });
        }

        function placeFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            // Don't spawn on snake body
            for (let part of snake) {
                if (part.x === food.x && part.y === food.y) placeFood();
            }
        }

        function resetGame() {
            velocity = { x: 0, y: 0 };
            snake = [{ x: 10, y: 10 }];
            score = 0;
            scoreElement.innerText = score;
        }

        // --- PARTICLE SYSTEM ---
        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x + gridSize / 2,
                    y: y + gridSize / 2,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05; // Fade out
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, 4, 4);
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        // Start
        window.requestAnimationFrame(update);

    </script>
</body>
</html>
